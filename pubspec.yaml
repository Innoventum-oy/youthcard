name: youth_card
description: Youth Card Mobile Application

# The following line prevents the package from being accidentally published to
# pub.dev using `pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
version: 2.0.1+42

environment:
  sdk: '>=3.13.0 <4.0.0'
  flutter: ">=3.47.0"

dependencies:
  core:
    git:
      url: git@github.com:Innoventum-oy/core.git
      path: core/
      ref: dynamic-objectmodel
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
   #internationalization:
  flutter_localizations:
      sdk: flutter
  intl: ^0.20.2 # for internationalization
  provider: ^6.0.0

  http: ^1.4.0
  #scoped_model: "^1.1.0"
  shared_preferences: ^2.0.5
  #flushbar: ^1.10.4
  path_provider: ^2.0.1
  #calendar day list for the calendar - view
  table_calendar: ^3.3.0
  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^2.0.0

  #cached images
  cached_network_image: ^4.0.4
  #for getting user location
  geolocator: ^14.0.0
  url_launcher: ^6.0.2
  another_flushbar: ^2.2.4
  flutter_html: ^3.0.0-alpha.2
  # flutter_html 3.0.0 calls a private API removed in html 0.15.7.
  html: 0.15.6
  flutter_settings_ui:
    git:
      url: https://github.com/Innoventum-oy/flutter_settings_ui
      ref: master
  glob: ^2.0.1
  feedback: ^3.1.0
  queue: ^3.1.0
  file_picker: ^13.1.0
  #for compatibility with ios 14 and flutter_html
  permission_handler: ^13.0.2
  date_range_form_field: ^1.0.2
  flutter_rating_bar: ^4.0.0
  wakelock_plus: ^1.3.2
  package_info_plus: ^10.2.2
  qr_code_scanner_plus: ^2.0.10+1
  geolocator_web: ^4.1.3
  shared_preferences_web: ^2.4.3
  url_launcher_web: ^2.4.1
  path: ^1.9.1
  crypto: ^3.0.6
dependency_overrides:
  # Core currently constrains package_info_plus to ^9; the app and
  # File Picker 13 require the compatible 10.x implementation.
  package_info_plus: ^10.2.2
  date_range_form_field:
    git:
      url: https://github.com/jleinone/date_range_form_field.git


dev_dependencies:
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_native_splash: ^2.4.6
  flutter_launcher_icons: ^0.14.3

  flutter_test:
    sdk: flutter

#if you make changes, regenerate with flutter pub run flutter_native_splash:create
flutter_native_splash:
  color: "#F7FBF9"
  color_dark: "#17313D"
  image: images/brand/splash-wordmark-light.png
  image_dark: images/brand/splash-wordmark-dark.png
  android_12:
    color: "#F7FBF9"
    color_dark: "#17313D"
    image: images/brand/app-icon.png
    image_dark: images/brand/app-icon.png

#if you make changes, regenerate with flutter pub run flutter_launcher_icons:main
flutter_launcher_icons:
  android: true
  ios: true
  image_path: images/brand/app-icon-opaque.png
  web:
    generate: true
    image_path: images/brand/app-icon-opaque.png
    background_color: "#F7FBF9"
    theme_color: "#087F77"

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter.
flutter:

  generate: true #for int
  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  assets:
    - images/
    - images/brand/
    - assets/config/appsettings.yaml
  #   - images/a_dot_ham.jpeg

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/assets-and-images/#resolution-aware.

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/assets-and-images/#from-packages

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/custom-fonts/#from-packages
